<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#062e29">
  <title>Triyana · Doctor at home in 10 minutes</title>
  <link rel="manifest" href="/static/patient.webmanifest">
  <link rel="icon" href="/static/icons/patient.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/patient-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/live.css">
  <link rel="stylesheet" href="/static/labs.css">
  <link rel="stylesheet" href="/static/shop.css">
  <link rel="stylesheet" href="/static/physio.css">
</head>
<body data-app="patient">
  <div class="login" id="login"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="mark" id="markA"></div><div><b>Triyana</b><small>Doctor at home in 10 min</small></div></div>
      <nav id="sideNav"></nav>
      <div class="spacer"></div>
      <div class="account-card">
        <label for="account">Signed in as</label>
        <button class="acct-who" id="acctWho" hidden></button>
        <select id="account" aria-label="Demo account"></select>
        <div class="demo-flag" id="demoFlag"><span id="flagIco"></span><span>Demo · fictional data</span></div>
        <div class="row" style="margin-top:8px;gap:6px;flex-wrap:nowrap"><button class="btn ghost sm sign-out" style="flex:1">Sign out</button><button class="btn ghost sm" id="reset" style="flex:1">Reset demo</button></div>
        <a class="app-switch" href="/provider">Are you a doctor or courier? Open Triyana Partner →</a>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="brand"><div class="mark" id="markB"></div><b>Triyana</b></div>
        <select id="accountMobile" aria-label="Demo account"></select>
        <button class="acct-me" id="acctMe" aria-label="Your account" hidden></button>
        <button class="btn ghost sm sign-out" aria-label="Sign out">Sign out</button>
      </header>
      <div class="content" id="view"></div>
    </div>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>

  <button class="yana-fab" id="yanaBtn" hidden><span class="yana-orb"></span><span class="label">Ask Yana</span></button>
  <section class="yana-panel" id="yanaPanel" aria-label="Yana assistant">
    <div class="yana-head"><span class="yana-orb"></span><div><b>Yana</b><span>Your medicine assistant · never changes prescriptions</span></div><button class="x" id="yanaClose" aria-label="Close">✕</button></div>
    <div class="yana-log" id="yanaLog"></div>
    <div class="chips" id="yanaChips"></div>
    <form class="yana-form" id="yanaForm">
      <input id="yanaInput" placeholder="Ask about your medicines…" autocomplete="off">
      <button class="btn primary" aria-label="Send">Send</button>
    </form>
  </section>
  <div class="toast" id="toast" role="status"></div>
  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/pwtoggle.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/accounts.js"></script>
  <script src="/static/labs.js"></script>
  <script src="/static/physio.js"></script>
  <script src="/static/live.js"></script>
  <script src="/static/shop.js"></script>
</body>
</html>
